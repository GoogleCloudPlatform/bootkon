#
# Runs the agenticdata per-project prep (bk-prep-project) INSIDE the very
# project the build executes in: $PROJECT_ID is Cloud Build's built-in
# substitution, so every build preps itself -- only _USERNAME comes from the
# submitter. One build per participant project means no shared concurrency
# limit and per-project quota isolation.
#
# Submitted by `content/agenticdata/provisioning/bk-prep-fleet --cloud-build`,
# which first creates the bootkon-provisioner service account (owner) that
# this build runs as. bk-prep-project self-installs its pinned terraform, so
# the plain cloud-sdk image suffices. CLOUD_LOGGING_ONLY is mandatory when a
# build runs as a custom service account; the timeout covers the 15-25
# minute prep (Cloud Build's default would cut it off at 10).

timeout: 3600s
options:
  logging: CLOUD_LOGGING_ONLY
serviceAccount: projects/$PROJECT_ID/serviceAccounts/bootkon-provisioner@$PROJECT_ID.iam.gserviceaccount.com
substitutions:
  _USERNAME: ""
steps:
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - ./content/agenticdata/provisioning/bk-prep-project "$PROJECT_ID" "${_USERNAME}"
